<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подземелья — галерея скелетов</title>
<style>
  body { margin:0; background:#11141a; color:#dfe5ef; font:14px/1.4 system-ui, sans-serif; }
  header { padding:10px 18px; background:#0d0f14; border-bottom:1px solid #2a3040;
           display:flex; gap:14px; align-items:center; position:sticky; top:0; z-index:2; }
  header h1 { font-size:15px; margin:0; } header a { margin-left:auto; color:#5aa0ff; text-decoration:none; }
  header button { background:#232a38; color:#dfe5ef; border:1px solid #39415a; border-radius:6px;
                  padding:4px 12px; cursor:pointer; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:16px; padding:16px; }
  .card { background:#171b23; border:1px solid #2a3040; border-radius:10px; padding:10px; }
  .card h3 { margin:0 0 8px; font-size:12.5px; font-weight:600; color:#cfe0ff; }
  .card .g { color:#8b96ab; font-weight:400; }
  .card svg { display:block; border-radius:6px; width:100%; height:auto; }
  #st { color:#8b96ab; font-size:12px; }
</style>
</head>
<body>
<header><h1>☠ Подземелья (скелеты, этап A)</h1><span id="st">загрузка…</span>
<button id="rr">перебросить</button><a href="/citydebug">← к городу</a></header>
<div id="grid"></div>
<script>
let batch = 0;
async function load() {
  const st = document.getElementById('st'), grid = document.getElementById('grid');
  grid.innerHTML = '';
  const envs = ['Ruin', 'Caverns', 'Forest', 'Swamp'];
  const jobs = [];
  for (let i = 0; i < 16; i++) {
    jobs.push((async () => {
      const env = envs[i % envs.length];
      const r = await fetch(`/api/citydebug/dungeonart?seed=g${batch}-${i}&env=${env}`).then(x => x.json());
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<h3>сид g${batch}-${i} <span class="g">· ${env} · комнат ${r.metrics.rooms} ·
        циклов ${r.metrics.cyclomatic} · замков ${r.locks} · секреток ${r.secrets}</span></h3>${r.svg}`;
      grid.appendChild(card);
    })());
  }
  await Promise.all(jobs);
  st.textContent = `16 данжей · циклическая генерация`;
}
document.getElementById('rr').onclick = () => { batch++; load(); };
load();
</script>
</body>
</html>
