<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планы локаций — галерея</title>
<style>
  body { margin:0; background:#11141a; color:#dfe5ef; font:14px/1.4 system-ui, sans-serif; }
  header { padding:10px 18px; background:#0d0f14; border-bottom:1px solid #2a3040;
           display:flex; gap:14px; align-items:center; position:sticky; top:0; z-index:2; }
  header h1 { font-size:15px; margin:0; } header a { margin-left:auto; color:#5aa0ff; text-decoration:none; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:16px; padding:16px; }
  .card { background:#171b23; border:1px solid #2a3040; border-radius:10px; padding:10px; }
  .card h3 { margin:0 0 8px; font-size:12.5px; font-weight:600; color:#cfe0ff; }
  .card .g { color:#8b96ab; font-weight:400; }
  .card svg { display:block; border-radius:6px; }
  #st { color:#8b96ab; font-size:12px; }
</style>
</head>
<body>
<header><h1>📜 Планы локаций (пул)</h1><span id="st">загрузка…</span><a href="/citydebug">← к городу</a></header>
<div id="grid"></div>
<script>
(async () => {
  const st = document.getElementById('st'), grid = document.getElementById('grid');
  const pool = await fetch('/api/citydebug/pool?kind=key').then(r => r.json());
  const list = pool.furnished || [];
  st.textContent = `обставлено ${list.length} из ${pool.total}`;
  for (const p of list) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h3>${p.name} <span class="g">· ${p.btype} · ${p.zones} зон</span></h3><div>рисуем…</div>`;
    grid.appendChild(card);
    fetch('/api/citydebug/planart?bid=' + encodeURIComponent(p.id)).then(r => r.json()).then(d => {
      card.lastElementChild.innerHTML = d.svg || d.error || '—';
    });
  }
})();
</script>
</body>
</html>
