<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DnD</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a22; --panel2:#1e222c; --raise:#242938;
    --line:#2a2f3c; --line2:#353b4a;
    --ink:#e9e6dd; --dim:#9aa0ad; --faint:#6c7280;
    --gold:#d9a441; --gold-dim:#8a6f34;
    --green:#5db07a; --blue:#5698e0; --red:#d9615a; --violet:#9b7bd4;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
  .top{height:46px;display:flex;align-items:center;gap:14px;padding:0 18px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font:600 15px var(--serif);letter-spacing:.02em;color:var(--gold)}
  .loc{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:7px}
  .loc b{color:var(--ink);font-weight:500}
  .loc .sep{color:var(--faint)}
  .top .right{margin-left:auto;display:flex;gap:16px;color:var(--dim);font-size:12.5px}
  .stage{display:flex;gap:12px;padding:12px;height:calc(100vh - 46px)}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;
    display:flex;flex-direction:column;overflow:hidden}
  .left{flex:0 0 480px;transition:flex-basis .35s ease}
  .center{flex:1}
  .right{flex:0 0 260px;transition:flex-basis .35s ease}
  body.dialogue .right{flex-basis:300px}
  .cap{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:11px 14px 6px}
  .map{flex:1;position:relative;margin:6px 10px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel2);overflow:hidden}
  .map svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .map svg.drag{cursor:grabbing}
  .msg .mrow{display:flex;gap:8px;align-items:flex-start}
  .msg .mav{width:26px;height:26px;border-radius:50%;flex:0 0 26px;overflow:hidden;display:flex;
    align-items:center;justify-content:center;font:500 11px var(--sans);color:#241a0c;margin-top:2px}
  .msg .mav img{width:100%;height:100%;object-fit:cover}
  .msg .mav.unk{background:var(--panel2);border:1px dashed var(--line2);color:var(--faint)}
  #talkchip{display:none;margin:0 0 -1px 2px}
  #talkchip.on{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
    border:1px solid var(--gold-dim);border-bottom:0;border-radius:8px 8px 0 0;
    padding:4px 10px;font:12px var(--sans);color:var(--gold)}
  #talkchip b{font-weight:500}
  #talkchip .x{cursor:pointer;color:var(--dim)}
  #talkchip .x:hover{color:var(--red)}
  .facegrid{display:flex;flex-wrap:wrap;gap:7px;padding:2px 12px 6px}
  .face{width:36px;height:36px;border-radius:50%;overflow:hidden;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;font:500 13px var(--sans);color:#241a0c;
    border:2px solid transparent}
  .face img{width:100%;height:100%;object-fit:cover}
  .face.unk{background:var(--panel2);border:1px dashed var(--line2);color:var(--faint)}
  .face.cur{border-color:var(--gold)}
  .face:hover{border-color:var(--gold-dim)}
  .face.more{background:var(--panel2);color:var(--dim);font-size:11px;cursor:default}
  .sceneline{padding:0 12px 8px;font:italic 12px var(--serif);color:var(--dim)}
  .overlay{position:fixed;inset:0;background:rgba(8,9,12,.82);z-index:60;display:flex;
    align-items:center;justify-content:center}
  .overlay.hidden{display:none}
  .parch{width:min(1040px,94vw);height:min(760px,92vh);border-radius:10px;position:relative;
    background:#e8d9b0;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 90px rgba(120,84,30,.45),
    inset 0 0 12px rgba(120,84,30,.35);overflow:hidden}
  .parch svg{width:100%;height:100%;filter:invert(.93) hue-rotate(180deg) sepia(.65) saturate(.6) contrast(.88) brightness(1.04)}
  .parch .ptitle{position:absolute;top:14px;left:0;right:0;text-align:center;
    font:600 20px var(--serif);color:#5a4013;letter-spacing:.06em;pointer-events:none}
  .parch .pclose{position:absolute;top:10px;right:14px;background:none;border:0;cursor:pointer;
    font:22px var(--serif);color:#5a4013}
  .invwin{width:min(680px,92vw);max-height:82vh;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:18px 20px;overflow:auto}
  .invwin h3{font:600 16px var(--serif);color:var(--gold);margin:0 0 12px;display:flex;
    justify-content:space-between;align-items:center}
  .invwin h3 button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px}
  .invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .invcard{padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);
    cursor:pointer}
  .invcard:hover{border-color:var(--gold-dim)}
  .invcard .bn{font-size:13.5px;color:var(--ink)}
  .invcard .bw{font-size:11px;color:var(--faint);margin-top:3px}
  .map.inside svg{pointer-events:none;filter:brightness(.45) saturate(.5)}
  .map .insidemsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font:13px var(--serif);font-style:italic;pointer-events:none;opacity:0}
  .map.inside .insidemsg{opacity:1}
  @keyframes pulseIn{0%,100%{stroke:#ffe6a8;stroke-width:2}50%{stroke:#d9615a;stroke-width:4}}
  .enterpulse{animation:pulseIn 1.2s infinite;fill:none}
  .waybtns{display:flex;gap:8px;margin:0 10px 8px}
  .waybtns button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--gold-dim);
    background:rgba(217,164,65,.1);color:var(--gold);font:500 12.5px var(--sans);cursor:pointer}
  .waybtns button:hover{background:rgba(217,164,65,.2)}
  .waybtns button.gray{border-color:var(--line2);background:transparent;color:var(--dim)}
  #dicewrap{margin:0 10px 10px;padding:10px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel2);display:none;align-items:center;gap:12px}
  #dicewrap.on{display:flex}
  .d20{width:54px;height:54px;flex:0 0 54px;perspective:300px}
  .d20 svg{width:100%;height:100%}
  .d20.rolling svg{animation:spin3d .9s cubic-bezier(.3,.7,.4,1.1)}
  @keyframes spin3d{0%{transform:rotateX(0) rotateY(0) scale(.7)}
    60%{transform:rotateX(680deg) rotateY(420deg) scale(1.15)}
    100%{transform:rotateX(720deg) rotateY(360deg) scale(1)}}
  .dtxt{font:12px var(--sans);color:var(--dim)}
  .dtxt b{color:var(--ink);font-size:14px}
  .dtxt .ok{color:var(--green)} .dtxt .fail{color:var(--red)}
  .zoom{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:2px;
    background:rgba(15,17,22,.82);border:1px solid var(--line2);border-radius:8px;padding:2px}
  .zoom button{background:transparent;border:0;color:var(--ink);font:500 16px var(--sans);
    width:26px;height:24px;cursor:pointer;border-radius:6px}
  .zoom button:hover{background:var(--raise);color:var(--gold)}
  .zoom span{font-size:10.5px;color:var(--dim);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
  .gobtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--gold);
    border:0;color:#1a1408;font:600 13px var(--sans);padding:8px 20px;border-radius:22px;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.45);animation:rise .2s ease;white-space:nowrap}
  .gobtn:hover{filter:brightness(1.08)}
  .gobtn span{opacity:.72;font-weight:500}
  #citybase{filter:brightness(.72) saturate(.86) contrast(1.03);pointer-events:none;transition:filter 1s ease}
  #skyrect{transition:fill 1s ease,opacity 1s ease}
  #citybase .h{pointer-events:auto;cursor:pointer;transition:fill .1s}
  #citybase .h:hover{fill:#ffdf87}
  #citybase .h.sel{fill:#ffd23f}
  .kmark{fill:#f4eddb;font-weight:600;paint-order:stroke;stroke:#140d04;stroke-width:.7px;
    cursor:pointer;pointer-events:auto}
  .kmark:hover{fill:#ffe6a8}
  .locard{margin:0 10px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
  .locard .nm{font:500 14px var(--serif);color:var(--gold)}
  .locard .kd{font-size:12px;color:var(--dim);margin-top:1px}
  .locard .desc{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.55}
  .conts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .cont{font-size:11px;padding:2px 8px;border-radius:6px;background:#171a22;border:1px solid var(--line2);color:var(--dim)}
  .cont.lk{color:var(--gold-dim);border-color:var(--gold-dim)}
  .cont.op{cursor:pointer}
  .cont.op:hover{border-color:var(--gold);color:var(--gold)}
  .bag{padding:2px 12px 12px;display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:32vh}
  .bagempty{font-size:12px;color:var(--faint);font-style:italic;padding:0 2px}
  .bagitem2{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2)}
  .bagitem2 .bn{font-size:13px;color:var(--ink)}
  .bagitem2 .bw{font-size:11px;color:var(--faint);margin-top:2px}
  .bagitem2 .bf{font-size:11.5px;color:var(--gold-dim);margin-top:4px;font-style:italic}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .acts button{font-size:11px;padding:3px 9px;border-radius:6px;background:transparent;
    border:1px solid var(--line2);color:var(--dim);cursor:pointer;transition:.15s}
  .acts button:hover{border-color:var(--gold-dim);color:var(--gold)}
  .cond{font-weight:500}
  .cond.ok{color:#6f9f6a}.cond.mid{color:#c9a24a}.cond.lo{color:#c98a52}.cond.br{color:var(--red)}
  .imod{color:var(--violet)}
  .iqual{color:var(--gold-dim)}
  .qm{color:var(--gold);font-weight:600;cursor:help}
  .commission{margin-top:12px;width:100%;padding:9px;border-radius:9px;background:rgba(217,164,65,.12);
    border:1px solid var(--gold-dim);color:var(--gold);font:500 13px var(--sans);cursor:pointer}
  .commission:hover{background:rgba(217,164,65,.2)}
  .acts .sellb{border-color:var(--gold-dim);color:var(--gold)}
  .ctcard{max-width:100%;text-align:left;font-size:12.5px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--gold-dim);border-radius:9px;padding:9px 11px;font-style:normal}
  .ctw{color:var(--faint);font-size:11px}
  .job{font-size:12px;color:var(--ink);padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2)}
  .job.jdone{color:var(--faint);text-decoration:none;border-style:dashed}
  #bagn{color:var(--dim);font-size:11px}
  .keys{display:flex;flex-wrap:wrap;gap:6px}
  .keychip{font-size:11.5px;padding:3px 9px;border-radius:6px;background:rgba(217,164,65,.1);
    border:1px solid var(--gold-dim);color:var(--gold);cursor:pointer}
  .keychip:hover{background:rgba(217,164,65,.22)}
  .npc{flex:1;display:flex;flex-direction:column;padding:0 12px 12px;overflow:auto}
  .portrait{width:100%;height:210px;flex:0 0 210px;border-radius:9px;border:1px solid var(--line2);
    background:radial-gradient(120% 100% at 50% 0%,#2a2f3e,#171a22);position:relative;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center}
  .portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;
    border-radius:9px;transition:opacity .25s}
  .portrait .frame{position:absolute;inset:0;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(217,164,65,.25)}
  .portrait .badge{position:absolute;top:8px;right:8px;font-size:10px;color:var(--gold-dim);z-index:1;
    background:rgba(0,0,0,.45);border:1px solid var(--gold-dim);border-radius:20px;padding:2px 8px}
  .av img{width:100%;height:100%;object-fit:cover;object-position:center 20%;border-radius:8px}
  .npc .who{display:flex;align-items:baseline;gap:8px;margin:10px 2px 2px}
  .npc .who .name{font:500 17px var(--serif);color:var(--ink)}
  .npc .who .role{font-size:12px;color:var(--dim)}
  .npcsub{font-size:11.5px;color:var(--faint);margin:3px 2px 0}
  .known{display:flex;flex-direction:column;gap:4px}
  .kn{font:italic 11.5px/1.45 var(--serif);color:var(--dim);border-left:2px solid var(--line2);padding-left:8px}
  .meter{display:grid;grid-template-columns:58px 1fr 30px;align-items:center;gap:8px;margin:7px 2px 0}
  .meter .ml{font-size:11px;color:var(--dim)}
  .meter .mv{font-size:11px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
  .track{height:6px;background:#12151c;border-radius:6px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:6px}
  .emo{margin:12px 2px 0;font-size:12px;color:var(--dim)}
  .emo b{color:var(--violet);font-weight:500}
  .subcap{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 2px 6px}
  .topics{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 11px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line2);color:var(--ink);cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--gold-dim);color:var(--gold)}
  .end{margin-top:14px;width:100%;padding:9px;border-radius:9px;background:transparent;
    border:1px solid var(--line2);color:var(--dim);font:inherit;cursor:pointer}
  .end:hover{border-color:var(--red);color:var(--red)}
  .thread{flex:1;overflow:auto;padding:16px 20px}
  .msg{max-width:88%;margin:0 0 16px;animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.narr{font:italic 15px/1.65 var(--serif);color:#cfcabc;border-left:2px solid var(--gold-dim);padding-left:14px}
  .msg.npc .sp{font:500 13px var(--sans);color:var(--gold);margin-bottom:2px}
  .msg.npc .tx{font:15px/1.6 var(--serif);color:var(--ink)}
  .msg.me{margin-left:auto;text-align:right;color:var(--dim)}
  .msg.me .tx{font-size:14px}
  .msg.me .tx::before{content:"\276f  ";color:var(--gold-dim)}
  .msg.sys{font-size:12px;color:var(--faint);text-align:center;font-style:italic;max-width:100%}
  .inbar{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}
  .inbar input{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:22px;
    color:var(--ink);font:14px var(--sans);padding:10px 16px;outline:none}
  .inbar input:focus{border-color:var(--gold-dim)}
  .inbar button{background:var(--gold);border:0;color:#1a1408;font:500 18px var(--sans);width:44px;height:40px;
    border-radius:22px;cursor:pointer}
  .inbar button:hover{filter:brightness(1.08)}
  .amb{padding:2px 12px 12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
  .amchips{display:flex;flex-wrap:wrap;gap:6px}
  .amchip{font-size:11.5px;padding:4px 10px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim)}
  .here{display:flex;flex-direction:column;gap:6px}
  .person{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;
    border:1px solid transparent;cursor:pointer;transition:.15s}
  .person:hover{background:var(--panel2);border-color:var(--line2)}
  .av{width:34px;height:34px;border-radius:8px;flex:0 0 34px;display:flex;align-items:center;
    justify-content:center;font:500 13px var(--sans);color:#151109}
  .person .pn{font-size:13px;color:var(--ink)}
  .person .pr{font-size:11px;color:var(--faint)}
  .person .go{margin-left:auto;color:var(--faint);font-size:17px}
  .person:hover .go{color:var(--gold)}
  .event{font:italic 12.5px/1.55 var(--serif);color:var(--dim);border-left:2px solid var(--line2);padding-left:11px}
  .lfeed{display:flex;flex-direction:column;gap:7px;max-height:34vh;overflow:auto}
  .lf{font:12px/1.5 var(--serif);color:var(--dim)}
  .lf b{color:var(--ink);font-weight:500}
  .lf .lfto{color:var(--faint);font-size:11px}
  .lf.lfd{color:var(--faint)}
  .lf.lfq{font-style:italic;color:var(--faint)}
  .hidden{display:none}
  .miniscene{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
  #combat{position:fixed;inset:0;background:rgba(10,11,15,.94);z-index:50;display:flex;gap:14px;padding:22px}
  #combat.hidden{display:none}
  .cbleft{flex:1;display:flex;flex-direction:column;min-width:0}
  .cbgrid{flex:1;border:1px solid var(--line2);border-radius:10px;background:var(--panel)}
  .cbright{flex:0 0 300px;display:flex;flex-direction:column;gap:10px}
  .cblog{flex:1;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    padding:10px 12px;font:12.5px/1.6 var(--serif);color:var(--dim)}
  .cbbtns{display:flex;gap:8px;flex-wrap:wrap}
  .cbbtns button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);
    color:var(--ink);font:500 12.5px var(--sans);cursor:pointer}
  .cbbtns button:hover{border-color:var(--gold-dim);color:var(--gold)}
  .cbhead{font:600 14px var(--serif);color:var(--gold)}
  .cbsub{font-size:11.5px;color:var(--faint)}
  .boardjob{font-size:12px;padding:8px 10px;border:1px solid var(--gold-dim);border-radius:9px;
    background:rgba(217,164,65,.07);color:var(--ink);margin-top:6px}
  .boardjob button{margin-left:8px;font-size:11px;padding:2px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--gold-dim);background:transparent;color:var(--gold)}
</style>
</head>
<body class="explore">

<div class="top">
  <span class="brand">&#10022; AI-DnD</span>
  <span class="loc"><b id="locname">Трактир</b><span class="sep">·</span><span id="locdist"></span></span>
  <span class="right"><span id="clock">вечер, 19:40</span><span>дождь</span><span id="hp">&#9829; 18/18</span><span id="coins">12 зм</span></span>
</div>

<div class="stage">
  <div class="col left">
    <div id="mapwrap">
      <div class="cap">карта <span id="here-lbl" style="color:var(--gold)"></span></div>
      <div class="map" id="mapbox"><svg id="mapsvg"></svg>
        <div class="insidemsg">ты внутри — карта подождёт снаружи</div>
        <div class="zoom"><button onclick="zoomBy(1/1.4)" aria-label="отдалить">&#8722;</button>
          <span id="zlvl">100%</span>
          <button onclick="zoomBy(1.4)" aria-label="приблизить">&#43;</button>
          <button onclick="recenter()" title="к игроку" style="font-size:12px">&#9678;</button></div>
        <button id="gobtn" class="gobtn hidden" onclick="go()">&#9654; идти <span id="goeta"></span></button>
      </div>
      <div class="waybtns" id="waybtns"></div>
      <div id="dicewrap"><div class="d20" id="d20box"></div><div class="dtxt" id="dtxt"></div></div>
      <div class="locard">
        <div class="nm">Трактир</div><div class="kd">таверна</div>
        <div class="desc">…</div>
      </div>
    </div>
  </div>

  <div class="col center">
    <div class="cap">повествование</div>
    <div class="thread" id="thread"></div>
    <div id="talkchip">говоришь с <b id="talkname"></b> <span class="x" onclick="endTalk()">✕</span></div>
    <div class="inbar">
      <input id="inp" placeholder="что делаешь?" autocomplete="off">
      <button id="send">&#8594;</button>
    </div>
  </div>

  <div class="col right">
    <div class="cap" id="rightcap">сцена</div>
    <div class="amb" id="amb"></div>
    <div class="cap" style="margin-top:4px;cursor:pointer" onclick="openInv()">🎒 сумка <span id="bagn"></span> — открыть</div>
    <div class="bag" id="bag" style="display:none"></div>
    <div class="cap" style="margin-top:4px">дела</div>
    <div class="bag" id="jobs"></div>
  </div>
</div>

<div id="parchwrap" class="overlay hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="parch">
    <div class="ptitle" id="ptitle">Карта</div>
    <button class="pclose" onclick="$('parchwrap').classList.add('hidden')">✕</button>
    <svg id="parchsvg"></svg>
  </div>
</div>
<div id="invwrap" class="overlay hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="invwin">
    <h3>Сумка <span id="invcoins" style="font-size:13px;color:var(--dim)"></span>
      <button onclick="$('invwrap').classList.add('hidden')">✕</button></h3>
    <div class="invgrid" id="invgrid"></div>

</div>

  <div style="text-align:center;max-width:460px;padding:0 24px">
    <div style="font:600 40px var(--serif);color:#7a1f1f;letter-spacing:.08em;margin-bottom:14px">✝</div>
    <div id="deathtext" style="font:italic 20px var(--serif);color:#e9e6dd;line-height:1.5"></div>

      border:1px solid var(--gold-dim);background:rgba(217,164,65,.12);color:var(--gold);
      font:500 14px var(--sans);cursor:pointer">начать заново</button>

  </div>

    <div class="cbhead">ход: <span id="cbturn"></span> · раунд <span id="cbround"></span></div>

      <button onclick="cbAct({type:'dodge'})">защита</button>

    </div>
    <div class="cbsub" id="cbhint">клик по клетке — шаг · клик по врагу — удар</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let mode='explore', cur=null, SCENE={here:[],ambient:{}}, CARD=null;
const api=async(u,b)=>{
  const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
  if(r.status===401){location.href='/login?next=/play';return {};}
  if(r.status===402){const d=await r.json().catch(()=>({}));
    try{push('sys','<span style="color:var(--red)">'+esc(d.detail||'дневной лимит исчерпан')+'</span>');}catch(e){}
    return {limited:true};}
  return r.json();
};
const esc=s=>String(s==null?'':s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>SCENE.here.find(x=>x.id===id)||{name:id,init:'?',color:'#8a6fae'};
const thread=()=>$('thread');
function push(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;
  thread().appendChild(d);thread().scrollTop=thread().scrollHeight;return d;}

let MAP=null,BVB=[0,0,100,100],Z=1,CX=50,CY=50,PXY={x:50,y:50},PANNED=false;
let CRXY={},PEND=null,SELEL=null,MINPERSTEP=1,GT=19*60+40;   // игровые минуты; +1 за шаг (густой граф)
const STEP_MS=240;                                          // реальная длительность одного шага анимации
function fmtClock(t){t=((t%1440)+1440)%1440;const h=Math.floor(t/60),m=t%60;
  const per=h<5?'ночь':h<11?'утро':h<17?'день':h<22?'вечер':'ночь';
  return per+', '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
// палитра суточного цикла: контрольные точки по часам → фильтр карты + цвет неба-подложки
const SKY=[
  {h:0, br:.46,sat:.70,ov:[10,16,46], oo:.52},   // глухая ночь — синь
  {h:5, br:.50,sat:.72,ov:[18,24,56], oo:.46},   // предрассветье
  {h:7, br:.80,sat:.94,ov:[74,60,84], oo:.20},   // рассвет — прохладно-розовый
  {h:10,br:1.00,sat:1.0,ov:[255,246,214],oo:.05},// утро
  {h:13,br:1.03,sat:1.0,ov:[255,242,206],oo:.02},// полдень — ярко и тепло
  {h:17,br:.94,sat:1.05,ov:[176,104,44],oo:.14}, // предвечерье — золото
  {h:19,br:.78,sat:1.07,ov:[126,60,30], oo:.26}, // закат — оранжево-тёплый
  {h:21,br:.60,sat:.90,ov:[52,34,66],  oo:.36},  // сумерки — фиолетовый
  {h:23,br:.50,sat:.74,ov:[14,20,56],  oo:.46},  // ночь
  {h:24,br:.46,sat:.70,ov:[10,16,46],  oo:.52},
];
function applySky(){const t=((GT/60)%24+24)%24;let a=SKY[0],b=SKY[SKY.length-1];
  for(let i=0;i<SKY.length-1;i++){if(t>=SKY[i].h&&t<=SKY[i+1].h){a=SKY[i];b=SKY[i+1];break;}}
  const f=(b.h-a.h)?(t-a.h)/(b.h-a.h):0,L=(x,y)=>x+(y-x)*f;
  const base=$('mapsvg').querySelector('#citybase');
  if(base)base.style.filter=`brightness(${L(a.br,b.br).toFixed(3)}) saturate(${L(a.sat,b.sat).toFixed(3)}) contrast(1.03)`;
  const rect=$('mapsvg').querySelector('#skyrect');
  if(rect){rect.style.fill=`rgb(${[0,1,2].map(k=>Math.round(L(a.ov[k],b.ov[k]))).join(',')})`;
    rect.style.opacity=L(a.oo,b.oo).toFixed(3);}}
function setClock(){const c=$('clock');if(c)c.textContent=fmtClock(GT);applySky();}
function setCoins(v){if(v==null)return;const c=$('coins');if(c)c.textContent=v+' зм';}
function setHp(v,mx){if(v==null)return;const c=$('hp');if(c)c.textContent='\u2665 '+v+'/'+(mx||PBMAXHP);}
let PBMAXHP=18;
function applyVB(){const w=BVB[2]/Z,h=BVB[3]/Z;
  $('mapsvg').setAttribute('viewBox',`${(CX-w/2).toFixed(1)} ${(CY-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  $('zlvl').textContent=Math.round(Z*100)+'%';}
function svgEl(m){
  const W=BVB[2],rpl=W*0.0092,lw=W*0.0022,fs=W*0.015;
  let g=`<g id="citybase">${m.svg||''}</g>`;
  g+=`<rect id="skyrect" x="0" y="0" width="${BVB[2]}" height="${BVB[3]}" fill="#0b1226" opacity=".22" pointer-events="none"/>`;
  m.keys.forEach(k=>g+=`<text class="kmark" data-id="${k.node}" x="${k.x}" y="${k.y-rpl*1.9}" font-size="${fs.toFixed(1)}" text-anchor="middle">${k.label}</text>`);
  g+=`<g id="destmark" pointer-events="none" style="display:none">
      <circle fill="none" stroke="#e5372a" stroke-width="${lw}"><animate attributeName="r" values="${rpl*0.5};${rpl*1.9};${rpl*0.5}" dur="1.05s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/></circle>
      <circle r="${rpl*0.5}" fill="#e5372a" stroke="#3a0d08" stroke-width="${lw*0.5}"><animate attributeName="r" values="${rpl*0.42};${rpl*0.58};${rpl*0.42}" dur="1.05s" repeatCount="indefinite"/></circle></g>`;
  g+=`<g id="pmark" transform="translate(${PXY.x},${PXY.y})" pointer-events="none">
      <circle r="${rpl}" fill="#d9a441" stroke="#241a08" stroke-width="${lw}"/>
      <circle r="${rpl}" fill="none" stroke="#ffe6a8" opacity=".55"><animate attributeName="r" values="${rpl};${rpl*2.6};${rpl}" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.2s" repeatCount="indefinite"/></circle></g>`;
  return g;
}
function showDest(x,y){const d=$('mapsvg').querySelector('#destmark');
  if(d){d.setAttribute('transform','translate('+x+','+y+')');d.style.display='';}}
function hideDest(){const d=$('mapsvg').querySelector('#destmark');if(d)d.style.display='none';}
function renderMap(){const s=$('mapsvg');s.innerHTML=svgEl(MAP);applyVB();
  s.querySelectorAll('.kmark').forEach(e=>e.addEventListener('click',ev=>{
    ev.stopPropagation();if(!PANNED)selectDest(+e.dataset.id,null);}));
  s.querySelectorAll('#citybase .h').forEach(e=>e.addEventListener('click',ev=>{
    ev.stopPropagation();if(PANNED)return;const nd=MAP.h2n[e.dataset.id];if(nd!=null)selectDest(nd,e);}));
  applySky();}
async function loadMap(){MAP=await api('/api/play/map');if(!MAP||!MAP.viewBox)return;
  BVB=MAP.viewBox;PXY=MAP.player;CX=PXY.x;CY=PXY.y;Z=Math.max(1.5,BVB[2]/560);
  CRXY={};(MAP.points||[]).forEach(p=>CRXY[p.id]=[p.x,p.y]);setClock();renderMap();}
function zoomBy(f){Z=Math.min(20,Math.max(0.85,Z*f));applyVB();}
function recenter(){CX=PXY.x;CY=PXY.y;Z=Math.max(Z,BVB[2]/560);applyVB();}
function clientToWorld(cx,cy){const s=$('mapsvg'),r=s.getBoundingClientRect(),w=BVB[2]/Z,h=BVB[3]/Z;
  return [CX-w/2+(cx-r.left)/r.width*w, CY-h/2+(cy-r.top)/r.height*h];}
function nearestCr(x,y){let best=null,bd=1e18;(MAP.points||[]).forEach(p=>{
  const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=p;}});return best;}
function clearSel(){const b=$('mapsvg').querySelector('#citybase');
  if(b)b.querySelectorAll('.h.sel').forEach(x=>x.classList.remove('sel'));SELEL=null;PEND=null;hideDest();$('gobtn').classList.add('hidden');}
function selectDest(cr,houseEl){
  if(cr==null)return;
  const b=$('mapsvg').querySelector('#citybase');
  if(b)b.querySelectorAll('.h.sel').forEach(x=>x.classList.remove('sel'));
  SELEL=houseEl||null;if(houseEl)houseEl.classList.add('sel');
  PEND=cr;const c=CRXY[cr];if(c)showDest(c[0],c[1]);
  $('goeta').textContent='';$('gobtn').classList.remove('hidden');
}
function walk(path){return new Promise(res=>{if(!path||!path.length){res();return;}let i=1;
  const pm=$('mapsvg').querySelector('#pmark');
  const step=()=>{const p=path[i];PXY={x:p[0],y:p[1]};
    if(pm)pm.setAttribute('transform','translate('+p[0]+','+p[1]+')');
    CX=p[0];CY=p[1];applyVB();GT+=MINPERSTEP;setClock();
    i++;if(i<path.length)setTimeout(step,STEP_MS);else res();};
  setTimeout(step,STEP_MS);});}
async function go(){
  if(PEND==null)return;const id=PEND;
  if(mode==='dialogue')endTalk();
  $('gobtn').classList.add('hidden');
  const r=await api('/api/play/move',{to:id});
  if(r.error){push('sys',r.error);clearSel();return;}
  const path=r.path||[];
  if(path.length){const d=path[path.length-1];showDest(d[0],d[1]);}
  await walk(path);
  hideDest();PEND=null;
  if(r.gt!=null){GT=r.gt;setClock();}
  setCoins(r.coins);
  if(r.contract_done){push('narr',esc(r.contract_done));renderJobs();}
  (r.feed||[]).forEach(f=>LIVEF.push(f));if(r.feed&&r.feed.length)renderFeed();
  (r.address||[]).forEach(a=>{const el=npcMsg(a.npc,a.text,'— тебе');el.style.cursor='pointer';el.onclick=()=>talk(a.npc);});
  MAP.loc=r.loc;SCENE=r;LIVEF=[];BOARD=null;renderAmb();renderWays();
  api('/api/play/scene').then(s2=>{SCENE=s2;if(s2.guild_board)BOARD={jobs:s2.guild_board,news:s2.guild_news};renderLoc(s2.location);renderWays();setHp(s2.hp,s2.max_hp);});
  $('locname').textContent=r.location.name;$('here-lbl').textContent='· '+(r.moved||r.location.name);
  renderLoc(r.location);
  push('narr','Ты доходишь до «'+(r.moved||r.location.name)+'» ('+fmtClock(GT).split(', ')[1]+').');
}
(function(){const s=$('mapsvg');let drag=null;
  s.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,cx:CX,cy:CY};PANNED=false;s.classList.add('drag');});
  window.addEventListener('mousemove',e=>{if(!drag)return;const r=s.getBoundingClientRect();
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3)PANNED=true;
    CX=drag.cx-(e.clientX-drag.x)*(BVB[2]/Z)/r.width;CY=drag.cy-(e.clientY-drag.y)*(BVB[3]/Z)/r.height;applyVB();});
  window.addEventListener('mouseup',()=>{if(drag){drag=null;s.classList.remove('drag');}});
  s.addEventListener('click',e=>{                       // клик по дороге/фону → ближайшая точка
    if(PANNED||e.target.closest('.h,.kmark'))return;
    const [wx,wy]=clientToWorld(e.clientX,e.clientY);const p=nearestCr(wx,wy);
    if(p)selectDest(p.id,null);});
  s.addEventListener('wheel',e=>{e.preventDefault();const r=s.getBoundingClientRect(),w=BVB[2]/Z,h=BVB[3]/Z;
    const mx=CX-w/2+(e.clientX-r.left)/r.width*w,my=CY-h/2+(e.clientY-r.top)/r.height*h;
    const nz=Math.min(20,Math.max(0.85,Z*(e.deltaY<0?1.2:1/1.2)));
    CX=mx+(CX-mx)*(Z/nz);CY=my+(CY-my)*(Z/nz);Z=nz;applyVB();},{passive:false});
})();

function faceHtml(n){
  const known=n.role&&n.role!=='кто-то из горожан';
  const inner=n.portrait?`<img src="${encodeURI(n.portrait)}" alt="">`:(known?esc(n.init):'?');
  const cls='face'+((n.portrait||known)?'':' unk')+(cur===n.id?' cur':'');
  const st=(n.portrait||!known)?'':` style="background:${n.color}"`;
  return `<span class="${cls}"${st} title="${esc(n.name)}${known?(' · '+esc(n.role)):''}"
    onclick="talk('${n.id}')">${inner}</span>`;
}
function sceneLine(){
  const looked=(SCENE.looked|0)>=1;
  if(!looked)return 'ты ещё не осмотрелся здесь';
  const k=(SCENE.location&&SCENE.location.kind)||'';
  return k;
}
function renderAmb(){
  const a=SCENE.ambient||{};
  const more=SCENE.here_more|0;
  $('amb').innerHTML=
    `<div class="amchips">${[a.time,a.weather,a.mood].filter(Boolean).map(x=>`<span class="amchip">${esc(x)}</span>`).join('')}</div>
     <div><div class="subcap" style="margin:2px 0 6px">кто здесь</div>
       <div class="facegrid">${SCENE.here.map(faceHtml).join('')}${more?`<span class="face more">+${more}</span>`:''}
       ${(!SCENE.here.length)?`<span style="font:italic 12px var(--serif);color:var(--faint)">${(SCENE.looked|0)<1?'осмотрись, чтобы различить людей':'никого'}</span>`:''}</div></div>
     <div class="sceneline">${esc(sceneLine())}</div>
     <div><div class="subcap" style="margin:2px 0 6px">вокруг</div><div class="lfeed" id="lfeed"></div></div>`;
  renderFeed();
}
let LIVEF=[],LIVEBUSY=false;
// ─── пошаговый мир: единый обработчик ответа действия ───
function applyWorld(r){
  if(!r)return;
  if(r.gt!=null){GT=r.gt;setClock();}
  setCoins(r.coins);if(r.hp!=null)setHp(r.hp);
  (r.narr||[]).forEach(t=>push('narr',esc(t)));
  (r.feed||[]).forEach(f=>LIVEF.push(f));
  if(r.feed&&r.feed.length)renderFeed();
  (r.address||[]).forEach(a=>{
    const el=npcMsg(a.npc,a.text,'— тебе');
    el.style.cursor='pointer';el.title='ответить';el.onclick=()=>talk(a.npc);});
  if(r.contract_done){push('narr',esc(r.contract_done));renderJobs();}
  if(r.dice)showDice(r.dice);
  if(r.location){SCENE=r;
    BOARD=r.guild_board?{jobs:r.guild_board,news:r.guild_news,status:r.guild_status}:null;
    renderAmb();renderLoc(r.location);renderWays();
    $('locname').textContent=r.location.name;}
}
function renderWays(){
  const el=$('waybtns');if(!el)return;
  const b=[];
  if(SCENE.inside)b.push(`<button onclick="exitB()">&#8592; выйти наружу</button>`);
  else if(SCENE.enterable)b.push(`<button onclick="enterB()">войти: ${esc(SCENE.enterable.name)}</button>`);
  if((SCENE.looked|0)<1)b.push(`<button onclick="lookAround()">&#128065; осмотреться</button>`);
  b.push(`<button class="gray" onclick="openParch()">&#128506; карта</button>`);
  b.push(`<button class="gray" onclick="waitTurn()">&#8987; ждать</button>`);
  el.innerHTML=b.join('');
  $('mapbox').classList.toggle('inside',!!SCENE.inside);
  renderEnterPulse();
}
function renderEnterPulse(){
  const old=document.getElementById('epulse');if(old)old.remove();
  if(SCENE.inside||!SCENE.enterable||!MAP)return;
  const k=(MAP.keys||[]).find(x=>x.bid===SCENE.enterable.bid);
  const svg=$('mapsvg');
  if(k&&svg){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('id','epulse');c.setAttribute('cx',k.x);c.setAttribute('cy',k.y);
    c.setAttribute('r',10);c.setAttribute('class','enterpulse');svg.appendChild(c);}
}
async function enterB(){applyWorld(await api('/api/play/enter',{}));}
async function exitB(){applyWorld(await api('/api/play/exit',{}));}
async function waitTurn(){applyWorld(await api('/api/play/live',{}));}
async function lookAround(){applyWorld(await api('/api/play/look',{}));}
function showDice(d){
  const box=$('d20box'),txt=$('dtxt'),wrap=$('dicewrap');
  wrap.classList.add('on');
  box.innerHTML=`<svg viewBox="0 0 60 60"><polygon points="30,3 55,17 55,43 30,57 5,43 5,17"
    fill="#1e222c" stroke="#d9a441" stroke-width="2"/><polygon points="30,3 55,17 30,30 5,17"
    fill="#242938" stroke="#8a6f34" stroke-width="1"/><text x="30" y="38" text-anchor="middle"
    font-size="20" font-weight="700" fill="#e9e6dd" id="dnum"></text></svg>`;
  box.classList.remove('rolling');void box.offsetWidth;box.classList.add('rolling');
  txt.innerHTML='<b>…</b>';
  let t=0;const iv=setInterval(()=>{
    document.getElementById('dnum').textContent=1+Math.floor(Math.random()*20);
    if(++t>7){clearInterval(iv);
      document.getElementById('dnum').textContent=d.roll;
      txt.innerHTML=`${esc(d.label||'бросок')}<br><b>${d.roll}</b>${d.mod?((d.mod>0?' + ':' − ')+Math.abs(d.mod)):''}`
        +` = <b>${d.total}</b> против СЛ ${d.dc} — <span class="${d.ok?'ok':'fail'}">${d.ok?'успех':'провал'}</span>`;}
  },110);
}

function renderFeed(){const el=$('lfeed');if(!el)return;
  el.innerHTML=LIVEF.length?LIVEF.slice(-14).map(f=>
    f.k==='speech'?`<div class="lf"><b>${esc(f.who)}</b> <span class="lfto">→ ${esc(f.to)}</span>: «${esc(f.text)}»</div>`
                  :`<div class="lf lfd">${esc(f.who)} · <i>${esc(f.text)}</i></div>`).join('')
    :'<div class="lf lfq">тихо — слышен лишь шум места</div>';
  el.scrollTop=el.scrollHeight;}
async function pollLive(){
  if(mode!=='explore'||LIVEBUSY)return;
  LIVEBUSY=true;
  try{const r=await api('/api/play/live',{});
    if(r.gt!=null){GT=r.gt;setClock();}
    (r.feed||[]).forEach(f=>LIVEF.push(f));
    if(r.feed&&r.feed.length)renderFeed();
    (r.address||[]).forEach(a=>{
      const el=push('npc',`<div class="sp">${esc(a.who)} — тебе</div><div class="tx">${esc(a.text)}</div>`);
      el.style.cursor='pointer';el.title='ответить — начать разговор';el.onclick=()=>talk(a.npc);});
  }catch(e){}finally{LIVEBUSY=false;}
}

const av=n=>n.portrait?`<img src="${encodeURI(n.portrait)}" alt="">`:esc(n.init);
function npcMsg(id,text,label){
  const n=byId(id)||{name:label||'голос',role:'',color:'#2a2f3c',init:'?'};
  const known=n.role&&n.role!=='кто-то из горожан';
  const avh=n.portrait?`<span class="mav"><img src="${encodeURI(n.portrait)}" alt=""></span>`
    :(known?`<span class="mav" style="background:${n.color}">${esc(n.init)}</span>`
           :`<span class="mav unk">?</span>`);
  const who=esc(n.name)+(known?` · ${esc(n.role)}`:'');
  const el=push('npc',`<div class="mrow">${avh}<div style="flex:1;min-width:0">
    <div class="sp">${who}${label?(' '+esc(label)):''}</div><div class="tx">${esc(text)}</div></div></div>`);
  return el;
}
const bar=(v,c)=>`<div class="track"><i style="width:${Math.round((+v||0)*100)}%;background:${c}"></i></div>`;
async function talk(id){
  cur=id;mode='dialogue';
  $('talkchip').classList.add('on');$('talkname').textContent=byId(id).name;
  $('inp').placeholder='сказать '+byId(id).name+'…';$('inp').focus();
  renderAmb();
  const n=await api('/api/play/talk',{npc:id});
  if(n.error){push('sys',esc(n.error));endTalk();return;}
  if(n.gt!=null){GT=n.gt;setClock();}
  CARD=n;renderBag();
  if(byId(id)){byId(id).name=n.name;byId(id).role=n.role;$('talkname').textContent=n.name;renderAmb();}
  if(n.contract){
    const ct=n.contract;
    const kd={bring:'добыть',deliver:'отнести',visit:'наведаться',befriend:'расположить к себе',dead:'покончить с'};

function bagItem(it){

  $('cbround').textContent=CB.round;
  $('cblog').innerHTML=CB.log.map(l=>'<div>'+esc(l)+'</div>').join('');
  $('cblog').scrollTop=$('cblog').scrollHeight;
  const svg=$('cbsvg'),W=CB.w,H=CB.h;

  svg.setAttribute('viewBox',`0 0 ${W*40} ${H*40}`);

    g+=`<rect class="cbcell" data-x="${x}" data-y="${y}" x="${x*40+1}" y="${y*40+1}" width="38" height="38"
        fill="${(x+y)%2?'#1b1f29':'#181c25'}" stroke="#232836" stroke-width="1" style="cursor:pointer"/>`;
  CB.obstacles.forEach(([x,y])=>g+=`<rect x="${x*40+4}" y="${y*40+4}" width="32" height="32" rx="5" fill="#2c3140"/>`);
  CB.units.forEach(u=>{
    if(u.fled||(!u.alive))return;
    const cx=u.x*40+20,cy=u.y*40+20,col=u.side==='party'?'#d9a441':'#c25450';
    const ring=u.id===CB.turn?`<circle cx="${cx}" cy="${cy}" r="17" fill="none" stroke="#ffe6a8" stroke-width="2" opacity=".8"/>`:'';
    g+=`${ring}<circle class="cbu" data-id="${u.id}" cx="${cx}" cy="${cy}" r="13" fill="${col}" stroke="#12151c" stroke-width="2" style="cursor:pointer"/>
       <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12" fill="#15120a" style="pointer-events:none">${esc((u.name[0]||'?').toUpperCase())}</text>
       <rect x="${cx-14}" y="${cy-21}" width="28" height="4" fill="#12151c"/>
       <rect x="${cx-14}" y="${cy-21}" width="${Math.max(0,28*u.hp/u.max_hp)}" height="4" fill="${u.side==='party'?'#5db07a':'#d9615a'}"/>`;
  });
  svg.innerHTML=g;
  svg.querySelectorAll('.cbcell').forEach(e=>e.addEventListener('click',()=>cbAct({type:'move',x:+e.dataset.x,y:+e.dataset.y})));
  svg.querySelectorAll('.cbu').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();
    const u=CB.units.find(x=>x.id===e.dataset.id);
    if(u&&u.side==='foes')cbAct({type:'attack',target:u.id});}));
  const me=CB.units.find(u=>u.id==='pc');
  $('cbhint').textContent=(me&&me.range>1)
    ? ('клик по клетке — шаг · клик по врагу — выстрел (дальность '+me.range+')')
    : 'клик по клетке — шаг · клик по врагу — удар';
}
async function cbAct(a){
  if(!CB)return;
  const r=await api('/api/play/combat_act',a);
  if(r.error){const el=$('cblog');el.innerHTML+='<div style="color:var(--red)">'+esc(r.error)+'</div>';el.scrollTop=el.scrollHeight;}
  if(r.combat){CB=r.combat;renderCombat();}
  if(r.hp!=null)setHp(r.hp);
  if(r.gt!=null){GT=r.gt;setClock();}
  if(r.over)handleOver(r.over);
}
function handleOver(over){
  if(!over)return;
  (over.narr||[]).forEach(t=>push('narr',esc(t)));
  if(over.hp!=null)setHp(over.hp);
  if(over.coins!=null)setCoins(over.coins);
  if(over.death){closeCombat();showDeath(over.death);return;}
  setTimeout(closeCombat, 1200);
}
function showDeath(d){
  $('deathtext').textContent=(d&&d.text)||'Тьма.';
  $('deathcause').textContent=(d&&d.cause)||'';
  $('deathdays').textContent='Прожито дней: '+((d&&d.days)||0);
  $('deathwrap').classList.remove('hidden');
}
// возобновить бой после перезагрузки страницы
api('/api/play/combat').then(r=>{if(r.active)openCombat(r.combat,{name:r.lair.name,sub:r.lair.env+' · CR '+r.lair.cr});});
</script>
</body>
